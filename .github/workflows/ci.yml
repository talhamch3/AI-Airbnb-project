name: MLOps Monitoring Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    services:
      mlflow_server:
        image: ghcr.io/mlflow/mlflow:v2.11.3
        ports:
          - 5000:5000
        # FIXED: Single-line option forces entrypoint script to bind globally without breaking Docker parsing
        options: --entrypoint mlflow server --host 0.0.0.0 --port 5000

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MLflow & Initialize Experiment
      run: |
        # Give the container time to complete its internal setup sequence
        sleep 5
        # FIXED: Target 127.0.0.1 since port 5000 is forwarded directly to the runner host
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://127.0.0.1:5000')
        mlflow.set_experiment('Airbnb Price Prediction')
        "

    - name: Execute Pytest Suite with Live Network Connections
      env:
        # FIXED: Standardized to loopback address to avoid DNS discovery issues
        MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      run: |
        pytest -s -v