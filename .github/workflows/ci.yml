name: MLOps Monitoring Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    services:
      mlflow_server:
        image: ghcr.io/mlflow/mlflow:v2.11.3
        ports:
          - 5000:5000
        # FIXED: Removed options entirely and use clean environment configurations
        env:
          MLFLOW_TRACKING_URI: http://0.0.0.0:5000

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MLflow & Initialize Experiment
      run: |
        # Give the background tracking server a clean window to bind its port
        sleep 8
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://mlflow_server:5000')
        mlflow.set_experiment('Airbnb Price Prediction')
        "

    - name: Execute Pytest Suite with Live Network Connections
      env:
        MLFLOW_TRACKING_URI: http://mlflow_server:5000
      run: |
        pytest -s -v