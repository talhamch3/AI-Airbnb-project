name: MLOps Monitoring Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure mlflow is explicitly installed in the runner toolchain
        pip install mlflow==2.11.3

    - name: Launch Live Background MLflow Server
      run: |
        # Starting MLflow with '&' runs it as a persistent background process on the host
        mlflow server --host 127.0.0.1 --port 5000 &
        
        # Give the local server a few seconds to initialize and bind to port 5000
        sleep 5

    - name: Initialize Experiment
      run: |
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://127.0.0.1:5000')
        mlflow.set_experiment('Airbnb Price Prediction')
        "

    - name: Execute Pytest Suite with Live Network Connections
      env:
        MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      run: |
        pytest -s -v

  deploy-stack:
    runs-on: ubuntu-latest
    needs: test-pipeline
    # Only deploy when pushing directly or merging into the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # FIXED: Convert the repository path to lowercase to comply with Docker standards
    - name: Sanitize Repository Name to Lowercase
      id: string
      run: |
        echo "REPO_LOWERCASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Tag Image as Latest
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # FIXED: Referenced the sanitized lowercase environment variable here
        tags: ghcr.io/${{ env.REPO_LOWERCASE }}/monitoring-pipeline:latest