name: MLOps Monitoring Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    services:
      mlflow_server:
        image: ghcr.io/mlflow/mlflow:v2.11.3
        ports:
          - 5000:5000
        # CRITICAL: Instructs the base image to actually execute the backend tracking server
        options: >-
          --entrypoint mlflow
        args: server --host 0.0.0.0 --port 5000

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MLflow & Initialize Experiment
      run: |
        # Gives the service container a moment to spin up completely
        sleep 5
        # FIXED: Replaced localhost with mlflow_server to match GitHub's service discovery network
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://mlflow_server:5000')
        mlflow.set_experiment('Airbnb Price Prediction')
        "

    - name: Execute Pytest Suite with Live Network Connections
      env:
        # Maps perfectly to your monitoring script logic configuration
        MLFLOW_TRACKING_URI: http://mlflow_server:5000
      run: |
        pytest -s -v