name: MLOps Monitoring Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    services:
      # This boots a live MLflow instance directly into the GitHub Actions runner network
      mlflow_server:
        image: ghcr.io/mlflow/mlflow:v2.11.3
        ports:
          - 5000:5000
        # Removed the health check options to prevent failure due to missing curl inside the image

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for MLflow & Initialize Experiment
      run: |
        # Give the background container a brief moment to finish booting up
        sleep 5
        # This reaches out to the live background container and creates your expected experiment
        python -c "
        import mlflow
        mlflow.set_tracking_uri('http://localhost:5000')
        mlflow.set_experiment('Airbnb Price Prediction')
        "

    - name: Execute Pytest Suite with Live Network Connections
      env:
        # Forces Python to target the runner's internal docker network proxy alias
        MLFLOW_TRACKING_URI: http://mlflow_server:5000
      run: |
        pytest -s -v